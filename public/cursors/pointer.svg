<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Classic Win98 pointing hand -->
  <g fill="white" stroke="black" stroke-width="1.2" stroke-linejoin="round">
    <!-- Index finger -->
    <rect x="10" y="1" width="5" height="14" rx="2"/>
    <!-- Middle finger -->
    <rect x="16" y="6" width="5" height="10" rx="2"/>
    <!-- Ring finger -->
    <rect x="22" y="7" width="5" height="9" rx="2"/>
    <!-- Palm -->
    <rect x="4" y="15" width="23" height="11" rx="3"/>
    <!-- Thumb -->
    <rect x="2" y="13" width="10" height="5" rx="2"/>
    <!-- Wrist -->
    <rect x="7" y="24" width="14" height="6" rx="1"/>
  </g>
</svg>
